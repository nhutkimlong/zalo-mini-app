services:
  - type: web
    name: nui-ba-den-travel-assistant-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "False"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: BEEKNOEE_BASE_URL
        value: https://platform-api.beeknoee.com/v1
      - key: BEEKNOEE_API_KEY
        sync: false
      - key: BEEKNOEE_LLM_MODEL
        value: gemini-2.5-flash
      - key: BEEKNOEE_EMBED_MODEL
        value: gemini-embedding-2
      - key: BEEKNOEE_TTS_MODEL
        value: google/google-tts
      - key: BEEKNOEE_INPUT_COST_PER_1M
        value: "0.30"
      - key: BEEKNOEE_OUTPUT_COST_PER_1M
        value: "2.50"
      - key: EMBEDDING_DIM
        value: "3072"
      - key: ZALO_BOT_TOKEN
        sync: false
      - key: ZALO_WEBHOOK_SECRET_TOKEN
        sync: false


  - type: static
    name: nui-ba-den-admin-dashboard
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        sync: false


  - type: static
    name: nui-ba-den-mini-app-pwa
    rootDir: mini-app
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
