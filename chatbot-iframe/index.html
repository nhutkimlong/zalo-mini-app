<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="description" content="AI Guide Núi Bà Đen - Trợ lý du lịch thông minh đồng hành cùng bạn.">
    <title>AI Guide - Tây Ninh Mới</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <!-- Tailwind CSS with custom config -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col text-slate-800" id="appBody" style="height:100dvh;overflow:hidden;">
    
    <!-- Premium App Bar -->
    <header class="bg-white/80 backdrop-blur-xl border-b border-slate-200/60 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-11 h-11 object-contain">
                <div>
                    <h1 class="text-base font-bold text-slate-900 leading-tight">AI Guide Bà Đen</h1>
                    <div class="flex items-center gap-1.5">
                        <span class="w-2 h-2 bg-brand-500 rounded-full animate-pulse"></span>
                        <span class="text-[11px] font-medium text-brand-700 uppercase tracking-wider">Đang trực tuyến</span>
                    </div>
                </div>
            </div>
            
            <nav class="flex items-center gap-2">
                <div class="flex bg-slate-100/80 p-1 rounded-xl">
                    <button id="tabChat" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all bg-white text-brand-700 shadow-sm">
                        Chat
                    </button>
                    <button id="tabPlanner" class="px-3 py-1.5 text-xs font-bold rounded-lg transition-all text-slate-500 hover:text-slate-700">
                        Lịch trình
                    </button>
                </div>
                <button id="resetChatBtn" title="Làm mới hội thoại" class="w-8 h-8 flex items-center justify-center rounded-lg text-slate-400 hover:text-red-500 hover:bg-red-50 transition-all">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                </button>
            </nav>
        </div>
    </header>

    <!-- Content Area -->
    <main class="flex-1 min-h-0 overflow-hidden relative">
        <!-- Floating Chat Decor -->
        <div class="absolute top-0 right-0 -z-10 w-64 h-64 bg-brand-200/30 blur-3xl opacity-50 rounded-full"></div>
        <div class="absolute bottom-20 left-0 -z-10 w-80 h-80 bg-emerald-100/40 blur-3xl opacity-60 rounded-full"></div>

        <!-- Chat View -->
        <div id="chatView" class="flex flex-col h-full min-h-0">
            <!-- Messages scroll area -->
            <div id="messagesContainer" class="flex-1 min-h-0 overflow-y-auto overscroll-contain w-full scroll-smooth flex flex-col justify-center">
                <div class="px-4 pt-4 pb-2 space-y-5 max-w-2xl mx-auto w-full">
                    <!-- Welcome Message -->
                    <div class="flex items-start gap-3">
                        <div style="width:36px;height:36px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#f0fdf4;color:#16a34a;border:1px solid #bbf7d0;">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                        </div>
                        <div style="max-width:85%;padding:12px 16px;background:#fff;border:1px solid #e2e8f0;border-radius:0.25rem 1rem 1rem 1rem;box-shadow:0 1px 4px rgba(0,0,0,0.06);">
                            <p style="font-size:15px;line-height:1.6;color:#1e293b;">Chào mừng bạn đến với <strong style="color:#15803d;">Khu du lịch quốc gia Núi Bà Đen</strong>! ⛰️<br>Tôi là trợ lý AI thông minh, rất vui được hỗ trợ bạn lên kế hoạch và tìm hiểu về Núi Bà Đen. Bạn cần hỏi gì ạ?</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Island - always at bottom -->
            <div class="shrink-0 px-3 pt-2 pb-[max(1rem,env(safe-area-inset-bottom))] bg-slate-50/95 backdrop-blur border-t border-slate-100">
                <div class="max-w-2xl mx-auto">
                    <!-- Suggested Questions Pill Area -->
                    <div id="suggestions" class="flex gap-2 overflow-x-auto no-scrollbar mb-2 transition-opacity duration-300">
                        <!-- Questions injected here -->
                    </div>

                    <div class="bg-white rounded-2xl shadow-md border border-slate-200" style="box-shadow:0 4px 20px rgba(0,0,0,0.08);">
                        <form id="chatForm" class="flex items-center gap-1 px-2 py-1">
                            <input id="userInput" type="text" placeholder="Hỏi về Núi Bà Đen..." 
                                class="flex-1 bg-transparent px-3 py-3 text-[15px] outline-none placeholder:text-slate-400" autocomplete="off" enterkeyhint="send">
                            <button id="sendBtn" type="submit" style="width:40px;height:40px;flex-shrink:0;border-radius:14px;background:#16a34a;color:white;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><line x1="22" y1="2" x2="11" y2="13"/><path d="m22 2-7 20-4-9-9-4Z"/></svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Planner View -->
        <div id="plannerView" class="hidden h-full flex flex-col bg-white">
            <div id="plannerFormContent" class="flex-1 overflow-y-auto px-6 py-8 max-w-2xl mx-auto w-full">
                <div class="flex items-center gap-3 mb-6">
                    <div class="w-12 h-12 bg-emerald-50 rounded-2xl flex items-center justify-center text-emerald-600">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-6 h-6"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-slate-900">Lập kế hoạch tự động</h2>
                        <p class="text-xs text-slate-500 font-medium">Bởi Trí tuệ nhân tạo (AI)</p>
                    </div>
                </div>

                <div class="space-y-6">
                    <div class="space-y-2">
                        <label class="text-sm font-bold text-slate-700 ml-1">Mô tả nhu cầu của bạn</label>
                        <textarea id="plannerRequest" rows="4" 
                            placeholder="Ví dụ: Tôi có 3 người, muốn đi vào buổi sáng sớm, ưu tiên ngắm tượng Phật Bà và ăn buffet..." 
                            class="w-full rounded-2xl border border-slate-200 p-4 text-[15px] focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 outline-none transition-all placeholder:text-slate-400 bg-slate-50/50"></textarea>
                    </div>

                    <div id="plannerSuggestions" class="space-y-2">
                        <!-- Examples here -->
                    </div>
                </div>
            </div>

            <div id="plannerResultContent" class="hidden flex-1 overflow-y-auto px-6 py-8 max-w-2xl mx-auto w-full">
                <!-- Result here -->
            </div>

            <div class="p-6 border-t border-slate-100 safe-bottom">
                <button id="generatePlannerBtn" class="w-full bg-slate-900 text-white font-bold py-4 rounded-2xl hover:bg-slate-800 transition-all flex items-center justify-center gap-2 shadow-xl active:scale-[0.98]">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="w-5 h-5"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
                    <span>Phân tích lịch trình</span>
                </button>
                <button id="backPlannerBtn" class="hidden w-full bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl hover:bg-slate-200 transition-all mt-3">
                    Làm mới yêu cầu
                </button>
            </div>
        </div>
    </main>

    <script type="module" src="main.js"></script>
</body>
</html>
